{

// ───────── 绘图工具
function text(str, x, y, size, col, alpha, font = SERIF, weight = 700, spacing = 4, align = "center") {
  if (alpha <= 0 || !str) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = col;
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.letterSpacing = spacing + "px";
  ctx.fillText(str, x, y + (1 - Math.min(1, alpha)) * 10);
  ctx.restore();
}
function vtext(str, x, y, size, col, alpha, font = SERIF, weight = 900) {
  [...str].forEach((ch, i) => text(ch, x, y + i * size * 1.1, size, col, alpha, font, weight, 0));
}

// 远山单独一层，可以缓慢横移（展卷感）
const HILLS = document.createElement("canvas"); HILLS.width = W * 2; HILLS.height = H;

    for (let x = 0; x <= W * 2; x += 20) p.lineTo(x, base - amp * (Math.sin(x * .004 + seed) * .6 + Math.sin(x * .011 + seed * 2) * .3 + Math.sin(x * .023) * .1));

})();

function stroke(pts, w, col = C.ink, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = col; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let i = 1; i < pts.length; i++) {
    const k = i / pts.length; ctx.lineWidth = w * (0.55 + 0.45 * Math.sin(Math.PI * k));
    ctx.beginPath(); ctx.moveTo(...pts[i - 1]); ctx.lineTo(...pts[i]); ctx.stroke();
  }
  ctx.restore();
}
// 方孔钱：o.ins 钱文（上下右左），o.hollow 掏空程度，o.rim 重轮
function coin(x, y, r, col, alpha, s = 1, o = {}) {
  if (alpha <= 0 || s <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(s, s);

  ctx.fillStyle = col === C.red ? "rgba(178,58,46,.16)" : `rgba(42,36,32,${.08 * (1 - hollow)})`;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();

  ctx.strokeStyle = col; ctx.lineWidth = r * .12; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();

  ctx.lineWidth = r * .09; ctx.strokeRect(-r * .24, -r * .24, r * .48, r * .48);

      text("发行有定额", x + 250, 760, 30, C.ink2, at(t, "x_jiaozi", 1.5), SERIF, 700, 3);

      note(x - 240, 540, 230, 380, "至元钞", "壹貫", 1);
      text("=", x - 40, 540, 90, C.red, 1, SERIF, 900, 0);
      for (let k = 0; k < 5; k++) note(x + 180 + k * 34, 560 - k * 14, 200, 330, "中统钞", "壹貫", 1, backOut(clamp((t - mk("x_yuan") - .8 - k * .2) / .3)), .05 * (k - 2), .4);
      text("× 5", x + 480, 380, 54, C.red, at(t, "x_yuan", 2), SERIF, 900, 2);
    } else if (i === 6) {   // 明：宝钞只值几文
      const fd = at(t, "x_ming2", 2.4);
      note(x - 220, 540, 300, 470, "大明通行寶鈔", "壹貫", 1, 1, 0, fd);
      const v = Math.round(lerp(1000, 5, fd));
      text("可换铜钱", x + 240, 430, 34, C.ink2, 1, SERIF, 700, 3);
      text(`${v} 文`, x + 240, 530, 110, fd > .5 ? C.red : C.ink, 1, SERIF, 900, 2);
      text("只发不收 · 不能兑换", x + 240, 650, 32, C.red, at(t, "x_ming"), SERIF, 900, 2);
      const q = fade(t, mk("x_ming3"), 1e9, .4);
      text("铸钱要铜 · 印钞只要纸", x + 240, 740, 34, C.ink, q, SERIF, 900, 3);
    }
    ctx.restore();
  });
  ctx.restore();
  // 小结：三招并排 → 同一个原理
  if (sumP > 0) {
    const sa = a * sumP;
    coin(560, 520, 70, C.ink, sa, 1, { ins: "半兩", hollow: .5 }); text("减重", 560, 640, 40, C.ink, sa, SERIF, 900, 6);
    coin(960, 520, 90, C.ink, sa, 1, { ins: "大五泉十" }); text("大钱", 960, 640, 40, C.ink, sa, SERIF, 900, 6);
    note(1360, 520, 150, 230, "寶鈔", "壹貫", sa, 1); text("纸钞", 1360, 690, 40, C.ink, sa, SERIF, 900, 6);
    const s2 = a * fade(t, mk("x_sum2"), 1e9, .4);
    text("凭空多出来的钱  →  换走真实的米", W / 2, 790, 46, C.red, s2, SERIF, 900, 4);
  }
};
SCN.end = (t, a) => {
  const fin = at(t, "e_title", .8);
  // 淡淡的小村子回来
  ctx.save(); ctx.globalAlpha *= (1 - fin) * fade(t, mk("e_vill"), 1e9, .6);
  ground(a);
  for (let k = 0; k < 5; k++) villager(380 + k * 60, GROUND - (k % 2) * 12, .85, a, k);
  for (let i = 0; i < 10; i++) { const [bx, by] = barrelPos(i); barrel(bx + 120, by, .8, a); }
  for (let k = 0; k < 10; k++) coin(330 + (k % 5) * 62, 420 + Math.floor(k / 5) * 66, 26, C.ink, a * fade(t, mk("e_rice"), 1e9, .4));
  ruler(RX, GROUND, 1, a * fade(t, mk("e_water"), 1e9, .5) * .5);
  ctx.restore();
  if (fin > 0) {
    text("没人偷你的钱", W / 2, 400, 120, C.ink, a * fin, BRUSH, 400, 10);
    text("钱却变空了", W / 2, 560, 120, C.ink, a * at(t, "e_title", 1.4), BRUSH, 400, 10);
    seal(W / 2 + 430, 560, 120, 120, "空", t - mk("e_title") - 1.4, 84);
    text("下一集 · 一个朝代一个朝代地看", W / 2, 720, 36, C.ink2, a * fade(t, mk("e_cta"), 1e9, .5), SERIF, 700, 4);
  }
};

// ───────── 主绘制
function draw(t) {
  T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(PAPER, 0, 0);
  ctx.drawImage(HILLS, -((t * 4) % W), 0);   // 远山缓慢横移，画面不会静止
  for (const R of RUNS) {
    const a = fade(t, R.t0 - .3, R.t1 + .35, .5);
    if (a > 0) { ctx.save(); SCN[R.sc](t, a, R); ctx.restore(); }
  }
  // 关键词：持续到下一个关键词或场景结束
  let curK = null;
  for (const R of RUNS) for (const e of R.es) if (e.k && t >= e.t0 - .1) {
    const next = R.es.find(x => x.t0 > e.t0 && x.k);
    const end = next ? next.t0 : R.t1;
    if (t < end + .3) curK = [e.k, e.t0, end];
  }
  if (curK) text(curK[0], W / 2, 140, 88, C.ink, fade(t, curK[1], curK[2], .35), BRUSH, 400, 6);
  // 出处
  for (const R of RUNS) R.es.forEach((e, i) => {
    if (!e.n) return;
    const nx = R.es.slice(i + 1).find(x => x.n), end = Math.min(nx ? nx.t0 : R.t1, e.t0 + 14);
    const al = fade(t, e.t0, end, .3) * .9;
    text("出处 · " + e.n, 70, 900, 25, C.ink2, al, SERIF, 500, 1, "left");
  });
  // 字幕
  for (const e of SCRIPT) {
    if (!e.s) continue;
    const al = fade(t, e.t0, e.t1, .15); if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al; ctx.font = `700 42px ${SERIF}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 10; ctx.strokeStyle = "rgba(244,237,220,.9)"; ctx.lineJoin = "round"; ctx.strokeText(e.s, W / 2, 985);
    ctx.fillStyle = C.ink; ctx.fillText(e.s, W / 2, 985); ctx.restore();
  }
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, "rgba(90,60,30,0)"); g.addColorStop(1, "rgba(90,60,30,.32)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fk = 1 - Math.min(clamp(t / .5), clamp((END - t) / .8));
  if (fk > 0) { ctx.fillStyle = `rgba(20,14,10,${fk})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = draw; window.END = END;
// 音效节点：新钱叮当、盖印、钱流动、纸声
window.events = () => ({
  clinks: [...[...Array(10)].map((_, k) => mk("v_mint") + .4 + k * .17), ...[0, 1, 2].map(k => mk("x_jia3") + .2 + k * .25)],
  seals: [mk("t_title") + .9, mk("v_double") + .5, mk("v_empty") + 1.0, mk("e_title") + 1.4],
  swish: [mk("v_buy"), mk("v_take"), mk("p_pour") + .5, mk("p_give"), mk("c_move")],
  pages: RUNS.filter(R => R.sc === "chap").map(R => R.t0),
  marks: M, end: END,
});
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`400 96px "Ma Shan Zheng"`, SCRIPT.map(e => (e.k || "") + (e.ch || "")).join("") + "钱是怎么被动手脚的没人偷你却变空了从哪儿来"),
  document.fonts.load(`700 42px "Noto Serif SC"`, "钱村"), document.fonts.load(`900 42px "Noto Serif SC"`, "钱村"), document.fonts.load(`500 42px "Noto Serif SC"`, "钱村"),
])).then(() => true);
</script></body></html>
