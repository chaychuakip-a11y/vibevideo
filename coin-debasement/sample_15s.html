<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#efe5cf}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 钱是怎么被动手脚的 · 第〇集 样片 15 秒 · 水墨纸本风格
const W = 1920, H = 1080, END = 15;
const C = { paper: "#f4eddc", paper2: "#e2d6bc", ink: "#2a2420", ink2: "#5a4e44", wash: "#8c8070", red: "#b23a2e" };
const BRUSH = '"Ma Shan Zheng", serif', SERIF = '"Noto Serif SC", serif';
const ctx = document.getElementById("c").getContext("2d");

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const fade = (t, a, b, d = 0.35) => clamp(Math.min((t - a) / d, (b - t) / d));
const backOut = p => { p = clamp(p); const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
let T = 0;

function text(str, x, y, size, col, alpha, font = SERIF, weight = 700, spacing = 4, align = "center") {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = col;
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.letterSpacing = spacing + "px";
  ctx.fillText(str, x, y + (1 - Math.min(1, alpha)) * 10);
  ctx.restore();
}

// ───────── 纸、远山
const PAPER = document.createElement("canvas"); PAPER.width = W; PAPER.height = H;
(() => {
  const p = PAPER.getContext("2d");
  const g = p.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, W * .7);
  g.addColorStop(0, C.paper); g.addColorStop(1, C.paper2);
  p.fillStyle = g; p.fillRect(0, 0, W, H);
  // 纸纤维
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * W, y = Math.random() * H, l = 6 + Math.random() * 22, a = Math.random() * Math.PI;
    p.strokeStyle = `rgba(120,100,70,${Math.random() * .07})`; p.lineWidth = .8;
    p.beginPath(); p.moveTo(x, y); p.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
  }
  // 晕染远山：两层，模糊
  p.filter = "blur(10px)";
  const ridge = (base, amp, col, seed) => {
    p.fillStyle = col; p.beginPath(); p.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) p.lineTo(x, base - amp * (Math.sin(x * .004 + seed) * .6 + Math.sin(x * .011 + seed * 2) * .3 + Math.sin(x * .023) * .1));
    p.lineTo(W, H); p.fill();
  };
  ridge(470, 120, "rgba(90,78,68,.13)", 1.3);
  ridge(560, 90, "rgba(60,52,46,.12)", 3.1);
  p.filter = "none";
})();

// ───────── 墨笔：带粗细变化的笔画
function stroke(pts, w, col = C.ink, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = col; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let i = 1; i < pts.length; i++) {
    const k = i / pts.length; ctx.lineWidth = w * (0.55 + 0.45 * Math.sin(Math.PI * k));
    ctx.beginPath(); ctx.moveTo(...pts[i - 1]); ctx.lineTo(...pts[i]); ctx.stroke();
  }
  ctx.restore();
}

// 方孔钱
function coin(x, y, r, col, alpha, s = 1) {
  if (alpha <= 0 || s <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col === C.red ? "rgba(178,58,46,.16)" : "rgba(42,36,32,.08)";
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = r * .14; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.lineWidth = r * .07; ctx.beginPath(); ctx.arc(0, 0, r * .78, 0, 7); ctx.stroke();
  ctx.lineWidth = r * .1; ctx.strokeRect(-r * .26, -r * .26, r * .52, r * .52);
  ctx.restore();
}
// 米桶
function barrel(x, y, s, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = "rgba(140,110,70,.18)";
  ctx.beginPath(); ctx.moveTo(-34, -60); ctx.quadraticCurveTo(-46, 0, -34, 60); ctx.lineTo(34, 60); ctx.quadraticCurveTo(46, 0, 34, -60); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.stroke();
  ctx.lineWidth = 3; for (const hy of [-30, 30]) { ctx.beginPath(); ctx.moveTo(-41, hy); ctx.lineTo(41, hy); ctx.stroke(); }
  // 米堆
  ctx.fillStyle = "#fbf7ec"; ctx.beginPath(); ctx.moveTo(-36, -60); ctx.quadraticCurveTo(0, -92, 36, -60); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.ink2; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = C.ink2; for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.ellipse(-20 + k * 7, -66 - (k % 3) * 5, 2.4, 1.4, .4, 0, 7); ctx.fill(); }
  ctx.restore();
}
// 村民（小墨人）
function villager(x, y, s, alpha, ph = 0) {
  if (alpha <= 0) return;
  const b = Math.sin(T * 2 + ph) * 2;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y + b); ctx.scale(s, s);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, -98, 17, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14, -78); ctx.lineTo(14, -78); ctx.lineTo(30, 0); ctx.lineTo(-30, 0); ctx.closePath();
  ctx.fillStyle = "rgba(42,36,32,.85)"; ctx.fill();
  ctx.restore();
}
// 官：戴展脚幞头的墨色身影
function ruler(x, y, s, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(0, -150, 26, 0, 7); ctx.fill();
  ctx.fillRect(-24, -186, 48, 22);                       // 帽
  ctx.fillRect(-92, -180, 184, 7);                        // 展脚
  ctx.beginPath(); ctx.moveTo(-26, -122); ctx.lineTo(26, -122); ctx.lineTo(62, 0); ctx.lineTo(-62, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.red; ctx.fillRect(-46, -66, 92, 9);    // 朱红腰带
  ctx.restore();
}
// 朱砂印章
function seal(x, y, w, h, str, p, size = 56, font = BRUSH, rot = -.06) {
  if (p <= 0) return;
  const s = lerp(1.8, 1, ease(clamp(p / .22)));
  ctx.save(); ctx.globalAlpha *= clamp(p / .12); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 6); ctx.fill();
  // 印泥斑驳
  ctx.fillStyle = C.paper; ctx.globalAlpha *= .25;
  for (let k = 0; k < 14; k++) { ctx.beginPath(); ctx.arc(((k * 37) % w) - w / 2, ((k * 53) % h) - h / 2, 2 + k % 3, 0, 7); ctx.fill(); }
  ctx.globalAlpha /= .25;
  text(str, 0, 2, size, C.paper, 1, font, 400, 2);
  ctx.restore();
}

// ───────── 字幕 / 关键词
const SUBS = [
  [0.2, 2.6, "钱，是怎么被“动手脚”的？"],
  [2.6, 5.6, "一个小村子：100 个人，100 桶米，100 枚钱"],
  [5.6, 8.2, "有一天，官府偷偷给自己多铸了 100 枚"],
  [8.2, 10.0, "钱多了一倍，米没变——米价翻倍"],
  [10.0, 11.4, "官府拿新钱，先买走一半的米"],
  [11.4, 12.8, "村民还是 100 枚，只买得到 50 桶"],
  [12.8, 14.8, "没人偷你的钱，但你的钱，变空了"],
];
const KEYS = [
  [2.8, 5.6, "一个小村"], [5.8, 8.2, "偷偷多铸一百枚"], [8.2, 10.0, "米价翻倍"], [10.2, 12.8, "价值流向了官府"],
];

// 布局
const VX = 330, BX0 = 700, BY = 640, RX = 1600, GROUND = 760;
const barrelPos = i => [BX0 + (i % 5) * 110, i < 5 ? BY - 70 : BY + 90];

function draw(t) {
  T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // 镜头：极慢横移，像展开长卷
  const pan = lerp(0, -30, t / END);
  ctx.drawImage(PAPER, 0, 0);

  // ── 片头
  const ta = fade(t, 0.3, 2.7, .45);
  if (ta > 0) {
    text("钱是怎么被动手脚的", W / 2, 440, 128, C.ink, ta, BRUSH, 400, 8);
    text("No One Stole Your Money, But Your Money Became Empty", W / 2, 560, 30, C.ink2, ta * fade(t, .8, 2.7, .4), SERIF, 500, 2);
    seal(W / 2 + 680, 440, 110, 110, "第〇集", t - 1.0, 34, SERIF);
    // 一笔横墨
    const w = 820 * ramp(t, .5, 1.3);
    stroke([[W / 2 - w / 2, 510], [W / 2, 505], [W / 2 + w / 2, 512]], 6, C.ink, ta * .8);
  }

  // ── 村子场景
  const sa = fade(t, 2.5, 12.9, .45);
  if (sa > 0) {
    ctx.save(); ctx.translate(pan, 0);
    // 地面一笔淡墨
    stroke([[120, GROUND + 6], [900, GROUND], [1800, GROUND + 8]], 5, C.wash, sa * .6);
    // 村民
    for (let k = 0; k < 5; k++) villager(VX - 160 + k * 60 + (k % 2) * 10, GROUND - (k % 2) * 12, .85 + (k % 2) * .1, sa * fade(t, 2.7 + k * .08, 99, .3), k);
    text("村民", VX - 40, GROUND + 50, 34, C.ink2, sa, SERIF, 700, 6);
    // 村民的 10 枚旧钱（每枚代表 10 枚）
    for (let k = 0; k < 10; k++) {
      const cx = VX - 200 + (k % 5) * 62, cy = 420 + Math.floor(k / 5) * 66;
      coin(cx, cy, 26, C.ink, sa, backOut(clamp((t - 3.0 - k * .05) / .35)));
    }
    text("100 枚", VX + 60, 330, 44, C.ink, sa * fade(t, 3.2, 99), SERIF, 900, 2);

    // 米桶：10 个（每个代表 10 桶）；后段 5 个滑向官府
    const take = ramp(t, 10.6, 11.8);
    for (let i = 0; i < 10; i++) {
      let [bx, by] = barrelPos(i);
      if (i >= 5) { bx = lerp(bx, RX - 450 + (i - 5) * 68, take); by = lerp(by, GROUND - 60, take); }
      barrel(bx, by, .8, sa * fade(t, 3.2 + i * .05, 99, .3));
    }
    text("100 桶米", BX0 + 220, BY + 200, 34, C.ink2, sa * fade(t, 3.6, 10.4), SERIF, 700, 4);

    // 价签：1 枚 = 1 桶 → 2 枚 = 1 桶
    const tagX = BX0 + 220, tagY = 420, flip = t > 8.4;
    const tagA = sa * fade(t, 3.8, 99, .3);
    if (tagA > 0) {
      ctx.save(); ctx.globalAlpha *= tagA; ctx.strokeStyle = flip ? C.red : C.ink; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tagX, 330); ctx.lineTo(tagX, 380); ctx.stroke();
      ctx.fillStyle = "rgba(251,247,236,.9)"; ctx.fillRect(tagX - 150, tagY - 40, 300, 80); ctx.strokeRect(tagX - 150, tagY - 40, 300, 80);
      ctx.restore();
      const fl = Math.abs(Math.cos(Math.PI * clamp((t - 8.2) / .4)));   // 翻牌
      ctx.save(); ctx.translate(tagX, tagY); ctx.scale(1, t > 8.2 && t < 8.6 ? fl : 1);
      text(flip ? "2 枚 = 1 桶" : "1 枚 = 1 桶", 0, 0, 44, flip ? C.red : C.ink, tagA, SERIF, 900, 2);
      ctx.restore();
      seal(tagX + 270, tagY - 30, 210, 70, "米价翻倍", t - 8.7, 42);
    }

    // 官府：5.6 秒登场，铸 10 枚朱红新钱
    const ra = sa * fade(t, 5.6, 99, .45);
    ruler(RX, GROUND, 1, ra);
    text("官府", RX, GROUND + 50, 34, C.red, ra, SERIF, 700, 6);
    const flow = ramp(t, 10.1, 10.9);   // 新钱流向米桶后消失
    for (let k = 0; k < 10; k++) {
      const hx = RX - 120 + (k % 5) * 62, hy = 420 + Math.floor(k / 5) * 66;
      const pop = backOut(clamp((t - 6.0 - k * .17) / .3));
      const [tx, ty] = barrelPos(k % 5);
      const cx = lerp(hx, tx, flow), cy = lerp(hy, ty - 60, flow) - Math.sin(Math.PI * flow) * 160;
      coin(cx, cy, 26, C.red, ra * (1 - ramp(t, 10.8, 11.1)), pop);
    }
    // 钱币总数计数：100 → 200
    const n = Math.round(lerp(100, 200, ramp(t, 6.0, 7.8)));
    text(t < 6 ? "" : `全村的钱：${n} 枚`, RX - 0, 300, 40, C.red, ra * fade(t, 6.0, 10.0), SERIF, 900, 2);

    // 结果：村民 100 枚 → 只能买 50 桶
    const ea = sa * fade(t, 11.4, 99, .3);
    if (ea > 0) {
      text("100 枚 → 只买 50 桶", VX - 30, 560, 40, C.red, ea, SERIF, 900, 2);
      stroke([[VX - 220, 588], [VX - 30, 585], [VX + 160, 590]], 5, C.red, ea * ramp(t, 11.5, 12.0));
    }
    ctx.restore();
  }

  // ── 关键词（毛笔字，顶部）
  for (const [a, b, s] of KEYS) text(s, W / 2, 140, 88, C.ink, fade(t, a, b, .35), BRUSH, 400, 6);

  // ── 结尾：两行毛笔字 + 「空」印
  const ea = fade(t, 12.8, 99, .5);
  if (ea > 0) {
    ctx.fillStyle = `rgba(244,237,220,${ea * .55})`; ctx.fillRect(0, 0, W, H);
    text("没人偷你的钱", W / 2, 400, 120, C.ink, ea, BRUSH, 400, 10);
    text("钱却变空了", W / 2, 560, 120, C.ink, fade(t, 13.4, 99, .5), BRUSH, 400, 10);
    seal(W / 2 + 430, 560, 120, 120, "空", t - 13.9, 84);
  }

  // ── 字幕
  for (const [a, b, s] of SUBS) {
    const al = fade(t, a, b, .15); if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al; ctx.font = `700 42px ${SERIF}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 10; ctx.strokeStyle = "rgba(244,237,220,.9)"; ctx.lineJoin = "round"; ctx.strokeText(s, W / 2, 985);
    ctx.fillStyle = C.ink; ctx.fillText(s, W / 2, 985); ctx.restore();
  }

  // 纸边暗角 + 淡入淡出
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, "rgba(90,60,30,0)"); g.addColorStop(1, "rgba(90,60,30,.32)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fadeK = 1 - Math.min(clamp(t / .4), clamp((END - t) / .5));
  if (fadeK > 0) { ctx.fillStyle = `rgba(20,14,10,${fadeK})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = draw; window.END = END;
// 音效时间点：新钱一枚一声、两次盖印、钱流向米桶
window.events = () => ({ clinks: [...Array(10)].map((_, k) => 6.0 + k * .17), seals: [1.0, 8.7, 13.9], flow: 10.1, slide: 10.6 });
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`400 96px "Ma Shan Zheng"`, "钱是怎么被动手脚的一个小村偷偷多铸百枚米价翻倍值流向了官府没人你却变空第〇集"),
  document.fonts.load(`700 42px "Noto Serif SC"`, "钱村"), document.fonts.load(`900 42px "Noto Serif SC"`, "钱村"), document.fonts.load(`500 42px "Noto Serif SC"`, "钱村"),
])).then(() => true);
</script></body></html>
