function text(str, x, y, size, col, alpha, weight = 700, align = "center", font = SANS, spacing = 1) {
  if (alpha <= 0 || str === "" || str == null) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = col;

}

const pen = (s, x, y, size, a, align = "center", rot = -.03) => { if (a <= 0) return; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); text(s, 0, 0, size, C.red, a, 400, align, PEN, 0); ctx.restore(); };
const label = (s, x, y, a, align = "left", size = 28) => text(s, x, y, size, C.line, a, 700, align);
function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }

function pdraw(p, prog, w = 3, col = C.line, alpha = 1, dash = null) {

  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (dash) ctx.setLineDash(dash);

function flow(p, alpha, w = 8, speed = 70, prog = 1) {

  pdraw(p, prog, w + 6, "rgba(127,211,255,.25)", alpha);
  ctx.save(); ctx.setLineDash([22, 16]); ctx.lineDashOffset = -T * speed; ctx.restore();
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = C.water; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.setLineDash([22, 16]); ctx.lineDashOffset = -T * speed;
  const L = polyLen(p) * clamp(prog); let acc = 0; ctx.beginPath(); ctx.moveTo(...p[0]);
  for (let i = 1; i < p.length; i++) { const s = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); if (acc + s >= L) { const q = (L - acc) / s; ctx.lineTo(lerp(p[i - 1][0], p[i][0], q), lerp(p[i - 1][1], p[i][1], q)); break; } ctx.lineTo(...p[i]); acc += s; }
  ctx.stroke(); ctx.restore();
}
function waterRect(x, y, w, h, alpha) {
  if (alpha <= 0 || h <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = "rgba(127,211,255,.35)"; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = C.water; ctx.lineWidth = 3; ctx.beginPath();
  for (let i = 0; i <= 20; i++) { const xx = x + w * i / 20, yy = y + Math.sin(i * .9 + T * 3) * 3; i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
  ctx.stroke(); ctx.restore();
}
// 剖面土层排线
function hatch(x, y, w, h, alpha, gap = 22) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = C.earth; ctx.lineWidth = 2;
  for (let k = -h; k < w; k += gap) { ctx.beginPath(); ctx.moveTo(x + k, y + h); ctx.lineTo(x + k + h, y); ctx.stroke(); }
  ctx.restore();
}
function dots(x, y, w, h, alpha) {   // 含水层：点
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = "rgba(127,211,255,.55)";
  for (let i = 0; i < w * h / 900; i++) { const px = x + ((i * 97) % w), py = y + ((i * 61) % h); ctx.beginPath(); ctx.arc(px, py, 2.4, 0, 7); ctx.fill(); }
  ctx.restore();
}
// 尺寸线
function dim(x1, y1, x2, y2, str, alpha, off = 0) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = C.line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const an = Math.atan2(y2 - y1, x2 - x1);
  for (const [x, y, d] of [[x1, y1, 1], [x2, y2, -1]]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + d * 14 * Math.cos(an - .35), y + d * 14 * Math.sin(an - .35)); ctx.moveTo(x, y); ctx.lineTo(x + d * 14 * Math.cos(an + .35), y + d * 14 * Math.sin(an + .35)); ctx.stroke(); }
  ctx.restore();
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  if (Math.abs(y2 - y1) > Math.abs(x2 - x1)) { if (off < 0) mono(str, mx - 14, my, 26, C.line, alpha, "right"); else mono(str, mx + 14 + off, my, 26, C.line, alpha, "left"); } else mono(str, mx, my - 22 + off, 26, C.line, alpha);
}
// 红铅笔圈
function circ(x, y, rx, ry, prog, alpha = 1) {
  if (alpha <= 0 || prog <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = C.red; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.beginPath();
  const n = 60 * clamp(prog) * 1.1;
  for (let i = 0; i <= n; i++) { const a = -1.9 + i / 60 * Math.PI * 2, wob = 1 + Math.sin(i * .7) * .03; const px = x + Math.cos(a) * rx * wob, py = y + Math.sin(a) * ry * wob; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke(); ctx.restore();
}

function arches(x0, y0, n, w, h, alpha, prog = 1) {   // 一层拱
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = C.line; ctx.lineWidth = 3;
  const m = Math.ceil(n * clamp(prog));
  for (let i = 0; i < m; i++) { const x = x0 + i * w; ctx.beginPath(); ctx.moveTo(x, y0 + h); ctx.lineTo(x, y0 + w * .5); ctx.arc(x + w / 2, y0 + w * .5, w / 2 - 4, Math.PI, 0); ctx.lineTo(x + w, y0 + h); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + m * w, y0); ctx.stroke(); ctx.restore();
}

// ───────── 主绘制

}
