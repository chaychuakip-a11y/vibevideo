  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = C.ink;
  rr(x - 40, y - 64, 80, 64, 6); ctx.fill();
  ctx.fillStyle = C.gold; rr(x - 24, y - 92, 48, 26, 4); ctx.fill();
  ctx.restore();
  if (label) text(label, x, y + 30, 26, C.ink, alpha, 700);
}
function bubble(x, y, str, alpha, col = C.ink) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `700 26px ${SANS}`;
  const w = ctx.measureText(str).width + 34;
  ctx.fillStyle = C.panel; ctx.strokeStyle = col; ctx.lineWidth = 3;
  rr(x - w / 2, y - 26, w, 52, 26); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 8, y + 25); ctx.lineTo(x, y + 40); ctx.lineTo(x + 8, y + 25); ctx.fill(); ctx.restore();
  text(str, x, y, 26, col, alpha, 700);
}
function card(x, y, w, h, alpha) { if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = C.panel; rr(x, y, w, h, 18); ctx.fill(); ctx.restore(); }

// ───────── 排队引擎：每条队 = 一串结账完成时刻
// people[k] = { arr: 到达时刻（相对场景起点），col }，done[k] = 第 k 位结完账的时刻
function laneFrom(done, n0, arrivals = [], youIdx = -1) {
  const people = [];
  for (let k = 0; k < n0; k++) people.push({ arr: -99, col: k === youIdx ? C.red : C.gray });
  for (const a of arrivals) people.push({ arr: a, col: C.gray });
  return { done, people };
}
// 画一条横向队伍：收银台在 cx，队伍往左排
function drawLane(L, t, cx, y, alpha, o = {}) {
  const gap = o.gap || 92, h = o.h || 96;
  register(cx, y, alpha, o.label);
  const s = k => clamp((t - L.done[k]) / .5);           // 第 k 位离开的进度
  let served = 0; for (let k = 0; k < L.people.length; k++) served += ease(s(k));
  L.people.forEach((p, k) => {
    if (t < p.arr) return;
    const leave = ease(s(k));
    let pos = k; for (let j = 0; j < k; j++) pos -= ease(s(j));
    const join = clamp((t - p.arr) / .5);
    let x = cx - 100 - pos * gap;
    if (p.arr > -50) x -= (1 - ease(join)) * 160;
    if (leave > 0) x = cx - 100 + leave * 220;
    const a = alpha * (p.arr > -50 ? ease(join) : 1) * (1 - leave);
    person(x, y, h, o.colorOf ? o.colorOf(k, p) : p.col, a);
    if (o.badge && o.badge(k, t)) bubble(x, y - h - 40, o.badge(k, t), a, C.ink);
  });
  return served;
}
const servedBy = (L, t) => L.done.filter(d => t >= d).length;

// ───────── 模拟数据（加载时算好）
// 1) 三条一样的队跑 1000 次：每条 5 人，服务时间 = 41 秒 + 3 秒 × 件数（件数 1–30 均匀），外加 8% 的“意外” 30–120 秒
const SIM = (() => {
  const r = rng(20261030), wins = [0, 0, 0];
  for (let i = 0; i < 1000; i++) {
    const tot = [0, 0, 0].map(() => { let s = 0; for (let k = 0; k < 5; k++) s += 41 + 3 * (1 + Math.floor(r() * 30)) + (r() < .08 ? 30 + r() * 90 : 0); return s; });
    wins[tot.indexOf(Math.min(...tot))]++;
  }
  return wins;   // 你在中间那条：wins[1]
})();
// 2) 分开排 vs 一条队：泊松到达、3 个收银台、服务时间指数分布（均值 1 分钟），到达率 2.5 人/分钟
const QSIM = (() => {
  const r = rng(7), N = 4000, exp = m => -Math.log(1 - r()) * m;
  const arr = [], svc = []; let t = 0;
  for (let i = 0; i < N; i++) { t += exp(1 / 2.5); arr.push(t); svc.push(exp(1)); }
  // 一条队：先来先服务，谁空去谁
  const free = [0, 0, 0], w1 = [];
  for (let i = 0; i < N; i++) { const j = free.indexOf(Math.min(...free)); const st = Math.max(arr[i], free[j]); w1.push(st - arr[i]); free[j] = st + svc[i]; }
  // 分开排：到达时看哪条人少就排哪条，之后不换
  const lanes = [[], [], []], w2 = [];
  for (let i = 0; i < N; i++) {
    const cnt = lanes.map(L => L.filter(e => e > arr[i]).length);
    const j = cnt.indexOf(Math.min(...cnt)), last = lanes[j].length ? lanes[j][lanes[j].length - 1] : 0;
    const st = Math.max(arr[i], last); w2.push(st - arr[i]); lanes[j].push(st + svc[i]);
  }
  const stats = w => { const s = w.slice(500), m = s.reduce((a, b) => a + b, 0) / s.length, sd = Math.sqrt(s.reduce((a, b) => a + (b - m) ** 2, 0) / s.length); return { s, m, sd, p90: [...s].sort((a, b) => a - b)[Math.floor(s.length * .9)] }; };
  return { single: stats(w1), split: stats(w2) };
})();

    text("Why Your Line Always Feels Slower", W / 2, 530, 36, C.red, a * fin, 700, NUM, 1);
    text("概率 · 随机 · 注意力 · 记忆 · 时间感", W / 2, 610, 34, C.gray, a * fade(t, mk("e_title") + .8, 1e9), 700);
  }
};

// ───────── 主绘制
function draw(t) {
  T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // 底部淡淡的地面条
  ctx.fillStyle = C.bg2; ctx.fillRect(0, 940, W, 140);
  for (const R of RUNS) {
    const a = fade(t, R.t0 - .3, R.t1 + .35, .5);
    if (a > 0) { ctx.save(); SCN[R.sc](t, a, R); ctx.restore(); }
  }
  // 章节进度（右上角）
  const chapNow = RUNS.filter(R => R.sc === "chap" && R.t0 <= t).length;
  if (chapNow > 0 && chapNow < 8) for (let k = 1; k <= 7; k++) {
    ctx.save(); ctx.globalAlpha = .9; ctx.fillStyle = k === chapNow ? C.red : (k < chapNow ? C.ink : C.light);
    ctx.beginPath(); ctx.arc(1600 + k * 34, 70, 9, 0, 7); ctx.fill(); ctx.restore();
  }
  // 关键词
  let curK = null;
  for (const R of RUNS) for (const e of R.es) if (e.k && t >= e.t0 - .1) {
    const next = R.es.find(x => x.t0 > e.t0 && x.k), end = next ? next.t0 : R.t1;
    if (t < end + .3) curK = [e.k, e.t0, end];
  }
  if (curK) text(curK[0], W / 2, 140, 76, C.ink, fade(t, curK[1], curK[2], .35), 900);
  // 出处
  for (const R of RUNS) R.es.forEach((e, i) => {
    if (!e.n) return;
    const nx = R.es.slice(i + 1).find(x => x.n), end = Math.min(nx ? nx.t0 : R.t1, e.t0 + 16);
    text("出处 · " + e.n, 60, 960, 22, C.gray, fade(t, e.t0, end, .3), 500, "left");
  });
  // 字幕
  for (const e of SCRIPT) {
    if (!e.s) continue;
    const al = fade(t, e.t0, e.t1, .15); if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al; ctx.font = `700 42px ${SANS}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 10; ctx.lineJoin = "round"; ctx.strokeStyle = C.bg2; ctx.strokeText(e.s, W / 2, 1015);
    ctx.fillStyle = C.ink; ctx.fillText(e.s, W / 2, 1015); ctx.restore();
  }
  const fk = 1 - Math.min(clamp(t / .5), clamp((END - t) / 1));
  if (fk > 0) { ctx.fillStyle = `rgba(31,27,22,${fk})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = draw; window.END = END;
window.events = () => ({ marks: M, end: END, sim: SIM, q: { single: [QSIM.single.m, QSIM.single.sd, QSIM.single.p90], split: [QSIM.split.m, QSIM.split.sd, QSIM.split.p90] },
  pages: RUNS.filter(R => R.sc === "chap").map(R => R.t0) });
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`900 76px "Noto Sans SC"`, SCRIPT.map(e => (e.k || "") + (e.ch || "") + e.s).join("")),
  document.fonts.load(`700 42px "Noto Sans SC"`, SCRIPT.map(e => e.s).join("")), document.fonts.load(`500 26px "Noto Sans SC"`, "出处示意模拟"),
  document.fonts.load(`900 40px "Geist"`, "0123456789/"),
])).then(() => true);
</script></body></html>
