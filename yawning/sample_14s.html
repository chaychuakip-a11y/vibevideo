<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0F1014}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 哈欠为什么会传染 · 14 秒样片 · Dark Math 风格
const W = 1920, H = 1080, END = 14;
const C = { bg: "#0F1014", blue: "#58C4DD", yellow: "#F4D35E", red: "#FC6255", white: "#ECECEC", dim: "#6B7280" };
const SERIF = '"Noto Serif SC", serif', SANS = '"Noto Sans SC", "WenQuanYi Zen Hei", sans-serif';
const ctx = document.getElementById("c").getContext("2d");

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));
// 出现 / 消失包络
const fade = (t, a, b, d = 0.35) => clamp(Math.min((t - a) / d, (b - t) / d));

// 哈欠包络：0→张开→保持→合上，单个哈欠 1.3 秒
const YAWN = 1.3;
function yawnAmt(t, start) {
  const p = (t - start) / YAWN;
  if (p <= 0 || p >= 1) return 0;
  if (p < .4) return ease(p / .4);
  if (p < .72) return 1;
  return 1 - ease((p - .72) / .28);
}

// 火柴人：脚底中心 (x,y)，s 缩放，y 打哈欠程度，col 颜色，point 指向观众程度
function stick(x, y, s, amt, col, alpha = 1, point = 0) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const lean = -amt * 10;           // 头向后仰
  const hip = [0, -95], neck = [lean * .4, -185], head = [lean, -228 - amt * 6];
  const line = (a, b) => { ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); };
  // 腿
  line(hip, [-38, 0]); line(hip, [38, 0]);
  // 身体
  line(hip, neck);
  // 手臂：自然下垂 → 伸懒腰举起；point 时右臂伸向镜头
  const sh = [neck[0], -168];
  const armL = lerp(Math.PI * .62, Math.PI * 1.18, amt);
  const armR = lerp(Math.PI * .38, -Math.PI * .18, amt);
  const L = 88;
  line(sh, [sh[0] + Math.cos(armL) * L, sh[1] + Math.sin(armL) * L]);
  if (point > 0) {
    // 透视缩短：手臂朝镜头伸出，手越来越大、越来越靠近画面中心
    const a = lerp(Math.PI * .38, -Math.PI * .1, point);
    const len = lerp(L, 34, point);
    const hand = [sh[0] + Math.cos(a) * len, sh[1] + Math.sin(a) * len + point * 8];
    line(sh, hand);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(hand[0], hand[1], 8 + point * 12, 0, 7); ctx.fill();
  } else {
    line(sh, [sh[0] + Math.cos(armR) * L, sh[1] + Math.sin(armR) * L]);
  }
  // 头
  ctx.beginPath(); ctx.arc(head[0], head[1], 38, 0, Math.PI * 2); ctx.stroke();
  // 眼睛：打哈欠时眯成线
  ctx.fillStyle = col;
  for (const ex of [-13, 13]) {
    if (amt > .45) line([head[0] + ex - 7, head[1] - 8], [head[0] + ex + 7, head[1] - 6]);
    else { ctx.beginPath(); ctx.arc(head[0] + ex, head[1] - 8, 4.5, 0, 7); ctx.fill(); }
  }
  // 嘴：张开成黄色椭圆
  const mh = 3 + amt * 17, mw = 7 + amt * 6;
  ctx.lineWidth = 5;
  if (amt > .05) {
    ctx.fillStyle = C.yellow; ctx.globalAlpha *= .9;
    ctx.beginPath(); ctx.ellipse(head[0], head[1] + 14, mw, mh, 0, 0, 7); ctx.fill();
  } else line([head[0] - 8, head[1] + 14], [head[0] + 8, head[1] + 14]);
  ctx.restore();
}

function heart(x, y, s, alpha) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.yellow;
  ctx.beginPath(); ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-22, -8, -12, -26, 0, -14);
  ctx.bezierCurveTo(12, -26, 22, -8, 0, 8); ctx.fill();
  ctx.restore();
}

function text(str, x, y, size, col, alpha, font = SERIF, weight = 700, spacing = 6) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = col;
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.letterSpacing = spacing + "px";
  ctx.fillText(str, x, y + (1 - alpha) * 14);
  ctx.restore();
}

// 字幕（中文，屏幕下方）
const SUBS = [
  [0.2, 2.6, "先别划走——看完这条，你可能会打哈欠"],
  [2.6, 5.0, "一个人打哈欠，旁边的人就一个接一个跟上"],
  [5.0, 7.4, "实验里，大约一半的人看到别人打哈欠会跟着打"],
  [7.4, 9.5, "而且，对方跟你越亲近，越容易被“传染”"],
  [9.5, 11.0, "有人说这是共情——但科学界还没有定论"],
  [11.0, 13.9, "所以，下一个是你。打了的，评论区说一声"],
];
// 出处脚注（没出处不上屏）
const NOTES = [
  [5.0, 7.4, "约 50%：Provine 实验室研究（UMBC）"],
  [7.6, 9.5, "Norscia & Palagi, PLoS ONE 2011 · 109 人自然观察：亲属 > 朋友 > 熟人 > 陌生人"],
  [9.6, 11.0, "Massen & Gallup 2017 综述：哈欠传染与共情的证据并不一致"],
];

const ROW = 7, GAP = 210;
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  // ── 镜头：开场推近第一个人 → 拉远看整排 → 结尾推向一个人
  const zoom = t < 2.6 ? lerp(1.9, 1.75, t / 2.6)
    : t < 11 ? lerp(1.75, 1, ramp(t, 2.6, 3.6))
    : lerp(1, 1.3, ramp(t, 11, 12.5)) + .25 * ramp(t, 12.5, 13.6);
  const firstX = W / 2 - (ROW - 1) / 2 * GAP;
  const focusX = t < 11 ? lerp(firstX, W / 2, ramp(t, 2.6, 3.6)) : W / 2;
  const groundY = 760;
  ctx.save();
  ctx.translate(W / 2, 600); ctx.scale(zoom, zoom); ctx.translate(-focusX, -600);

  // 地平线
  ctx.strokeStyle = "rgba(236,236,236,.10)"; ctx.lineWidth = 2 / zoom;
  ctx.beginPath(); ctx.moveTo(-2000, groundY + 4); ctx.lineTo(4000, groundY + 4); ctx.stroke();

  const sceneB = fade(t, -1, 7.6, .4);        // 第一、二拍：多米诺
  const sceneC = fade(t, 7.4, 11.1, .4);      // 第三拍：亲近 vs 陌生
  const sceneD = fade(t, 10.9, 20, .4);       // 第四拍：指向观众

  if (sceneB > 0) {
    for (let i = 0; i < ROW; i++) {
      const start = i === 0 ? 1.2 : 2.9 + (i - 1) * 0.55;
      const a = i === 0 ? 1 : fade(t, 2.7 + i * .06, 99, .4);
      stick(firstX + i * GAP, groundY, 1, yawnAmt(t, start), C.blue, sceneB * a);
    }
  }

  if (sceneC > 0) {
    // 左：亲近的三个人挤在一起（亲属 / 朋友）；右：远处的陌生人
    const cx = W / 2 - 330;
    const near = [[cx - 135, 8.0], [cx, 7.75], [cx + 135, 8.05]];
    near.forEach(([x, st], i) => stick(x, groundY, 1, yawnAmt(t, st), C.blue, sceneC));
    const hb = fade(t, 7.7, 11.1, .3);
    heart(cx - 68, groundY - 330, 1.3 + .1 * Math.sin(t * 6), hb * sceneC);
    heart(cx + 68, groundY - 330, 1.3 + .1 * Math.sin(t * 6 + 1), hb * sceneC);
    // 陌生人：更晚、更弱
    const sx = W / 2 + 520;
    stick(sx, groundY, 1, yawnAmt(t, 9.0) * .45, C.dim, sceneC);
    text("亲近的人", cx, groundY + 70, 34, C.yellow, sceneC * fade(t, 7.8, 11.1), SANS, 500, 4);
    text("陌生人", sx, groundY + 70, 34, C.dim, sceneC * fade(t, 7.8, 11.1), SANS, 500, 4);
  }

  if (sceneD > 0) {
    // 先指向观众，再放下手，打一个大哈欠
    const pt = ramp(t, 11.4, 11.9) * (1 - ramp(t, 12.5, 12.8));
    stick(W / 2, groundY, 1.15, pt > .01 ? 0 : yawnAmt(t, 12.6), C.blue, sceneD, pt);
  }
  ctx.restore();

  // ── 屏幕上的关键词（≤8 字一组，同屏最多两组）
  text("看完这条", W / 2, 150, 76, C.white, fade(t, .3, 2.6));
  text("你可能会打哈欠", W / 2, 250, 96, C.yellow, fade(t, .9, 2.6));
  text("哈欠会传染", W / 2, 170, 96, C.white, fade(t, 3.0, 7.4));
  text("约一半人会跟着打", W / 2, 285, 60, C.yellow, fade(t, 5.1, 7.4));
  text("越亲近 越容易传染", W / 2, 170, 88, C.white, fade(t, 7.6, 9.5));
  text("是共情？", W / 2, 170, 96, C.white, fade(t, 9.5, 11.0));
  text("尚无定论", W / 2, 285, 60, C.red, fade(t, 9.9, 11.0));
  text("下一个", W / 2, 150, 76, C.white, fade(t, 11.3, 14.5));
  text("是你", W / 2, 260, 120, C.yellow, fade(t, 11.9, 14.5));

  // ── 出处脚注（左下角）
  for (const [a, b, s] of NOTES) {
    const al = fade(t, a, b, .3) * .9;
    if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = "#9AA3B2";
    ctx.font = `400 26px ${SANS}`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText("出处 · " + s, 70, 890); ctx.restore();
  }

  // ── 字幕
  for (const [a, b, s] of SUBS) {
    const al = fade(t, a, b, .18);
    if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al;
    ctx.font = `500 42px ${SANS}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 8; ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.strokeText(s, W / 2, 985);
    ctx.fillStyle = C.white; ctx.fillText(s, W / 2, 985); ctx.restore();
  }

  // ── 电影感：暗角 + 颗粒 + 开场 / 结尾淡入淡出
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  grain(t);
  const black = 1 - Math.min(clamp(t / .4), clamp((END - t) / .5));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

// 颗粒：预生成几张噪点图轮流叠
const GR = [];
for (let k = 0; k < 6; k++) {
  const cv = document.createElement("canvas"); cv.width = 480; cv.height = 270;
  const c2 = cv.getContext("2d"), im = c2.createImageData(480, 270);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14;
  }
  c2.putImageData(im, 0, 0); GR.push(cv);
}
function grain(t) { ctx.drawImage(GR[Math.floor(t * 24) % GR.length], 0, 0, W, H); }

window.draw = draw;
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`700 96px "Noto Serif SC"`, "哈欠"),
  document.fonts.load(`500 42px "Noto Sans SC"`, "哈欠"),
])).then(() => true);
</script></body></html>
